<svg viewBox="0 0 48 48" width="48" height="48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="yarnBall" cx="36%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#e08b5f"/>
      <stop offset="55%" stop-color="#c4663e"/>
      <stop offset="100%" stop-color="#8e4526"/>
    </radialGradient>
    <clipPath id="yarnClip"><circle cx="22" cy="26" r="17"/></clipPath>
  </defs>
  <!-- loose strand trailing from the ball -->
  <path d="M33 14 C41 12 44 18 41 23 C39 27 42 30 45 29" stroke="#c4663e" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <circle cx="22" cy="26" r="17" fill="url(#yarnBall)"/>
  <!-- wound strands: offset bundles, the way yarn actually lies on a ball -->
  <g clip-path="url(#yarnClip)" fill="none" stroke-linecap="round">
    <g stroke="#9d4b28" stroke-width="2.1" opacity=".8">
      <ellipse cx="18" cy="24" rx="15" ry="8" transform="rotate(-38 18 24)"/>
      <ellipse cx="25" cy="28" rx="15" ry="8" transform="rotate(-38 25 28)"/>
      <ellipse cx="24" cy="23" rx="14" ry="7" transform="rotate(34 24 23)"/>
      <ellipse cx="19" cy="31" rx="14" ry="6" transform="rotate(34 19 31)"/>
    </g>
    <g stroke="#eda877" stroke-width=".8" opacity=".5">
      <ellipse cx="18" cy="23.1" rx="15" ry="8" transform="rotate(-38 18 23.1)"/>
      <ellipse cx="25" cy="27.1" rx="15" ry="8" transform="rotate(-38 25 27.1)"/>
      <ellipse cx="24" cy="22.1" rx="14" ry="7" transform="rotate(34 24 22.1)"/>
    </g>
  </g>
  <!-- highlight and rim keep it from looking flat -->
  <ellipse cx="15.5" cy="17.5" rx="5.6" ry="3.6" transform="rotate(-34 15.5 17.5)" fill="#fff" opacity=".2"/>
  <circle cx="22" cy="26" r="17" stroke="#7d3c20" stroke-width="1" opacity=".4"/>
</svg>
